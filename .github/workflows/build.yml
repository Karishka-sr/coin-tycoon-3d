name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests and desktop build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run logic tests
        run: ./gradlew --no-daemon core:test

      - name: Compile desktop module
        run: ./gradlew --no-daemon lwjgl3:classes

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      - name: Point Gradle at the SDK
        run: echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon android:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coin-tycoon-3d-debug-apk
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
